name: Clone Triggering Repo to Databricks

on:
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  sync-repo:
    runs-on: ubuntu-latest
    steps:

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
        
      - name: Verify git credential exists
        run: |
          CRED_COUNT=$(databricks git-credentials list -o json | jq 'length')
          if [ "$CRED_COUNT" -eq 0 ]; then
            echo "No hay ningún git credential configurado. Ve a Settings -> Linked accounts en Databricks y autoriza GitHub."
            exit 1
          fi
          echo "Git credential encontrado, continuando..."
      - name: Ensure parent folder exists
        run: databricks workspace mkdirs /Repos/test

      - name: Show github credentials
        run: databricks git-credentials list -o json | jq 'length'

      - name: Clone or update repo in Databricks
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPO_PATH: /Repos/test/${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if databricks repos get "$REPO_PATH" >/dev/null 2>&1; then
            echo "Repo ya existe en $REPO_PATH, actualizando a $BRANCH..."
            databricks repos update "$REPO_PATH" --branch "$BRANCH"
          else
            echo "Clonando $REPO_URL en $REPO_PATH..."
            databricks repos create "$REPO_URL" gitHub --path "$REPO_PATH"
            databricks repos update "$REPO_PATH" --branch "$BRANCH"
          fi

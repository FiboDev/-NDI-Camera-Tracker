[project]
name = "face-tracker"
version = "0.1.0"
description = "Tracker for preacher/speaker at churches"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.13.0.92",
    "ultralytics>=8.4.37",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchaudio==2.9.1",
    "mediapipe>=0.10.33",
    "torchreid>=0.2.5",
    "deep-sort-realtime>=1.3.2",
    "gdown>=6.0.0",
    "tensorboard>=2.20.0",
    "onvif-zeep>=0.2.12",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
